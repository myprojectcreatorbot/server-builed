<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Своя Блек Раша за 5 минут</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #09090b;
            color: #ffffff;
            padding: 20px 16px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .badge {
            color: #f59e0b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #a1a1aa;
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #141416;
            border: 1px solid #27272a;
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: #71717a;
        }
        .section-title {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 10px;
        }
        .list-card {
            background: #141416;
            border: 1px solid #27272a;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid #27272a;
            gap: 12px;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #1f1f23;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .item-info {
            flex: 1;
        }
        .item-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .item-desc {
            font-size: 12px;
            color: #71717a;
        }
        .pill-btn {
            background: #27272a;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .footer-note {
            font-size: 12px;
            color: #71717a;
            line-height: 1.4;
            margin-top: 8px;
            margin-bottom: 20px;
        }
        .main-btn {
            width: 100%;
            padding: 16px;
            margin-top: auto;
            border-radius: 14px;
            border: none;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .main-btn:active {
            opacity: 0.8;
        }
        .back-btn {
            background: transparent;
            color: #a1a1aa;
            border: none;
            font-size: 14px;
            margin-top: 12px;
            padding: 8px;
            cursor: pointer;
            width: 100%;
        }
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .step-counter {
            color: #f59e0b;
            font-size: 13px;
            font-weight: 700;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #27272a;
            border-radius: 2px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #ffffff;
            transition: width 0.3s ease;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-label {
            display: block;
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 8px;
        }
        .text-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #27272a;
            background: #141416;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        .text-input:focus {
            border-color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container" id="app"></div>
